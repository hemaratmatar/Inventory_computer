[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.21.0"
  NPM_VERSION = "11.19.0"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIRESTORE_PRODUCTS_COLLECTION,VITE_FIRESTORE_PEOPLE_COLLECTION,VITE_FIRESTORE_ROOMS_COLLECTION"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
